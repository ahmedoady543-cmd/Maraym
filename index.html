<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة خاصة جداً ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 90%;
      position: relative;
    }
    h1 { color: #d63384; margin-bottom: 15px; font-size: 1.8rem; }
    p { color: #555; font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; }
    .btn-container { display: flex; justify-content: center; gap: 15px; position: relative; min-height: 60px; }
    button {
      padding: 12px 25px; font-size: 1rem; border: none; border-radius: 25px;
      cursor: pointer; font-weight: bold; transition: transform 0.2s;
    }
    .btn-yes { background-color: #ff4757; color: white; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); }
    .btn-yes:hover { transform: scale(1.05); }
    .btn-no { background-color: #747d8c; color: white; position: absolute; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- المرحلة الأولى -->
  <div id="step1" class="card">
    <h1>رسالة خاصة! ✉️</h1>
    <p>وصلتك رسالة خاصة من شخص حاب يوصلك إياها بطريقة مختلفة...</p>
    <button class="btn-yes" onclick="nextStep(2)">افتح الرسالة ✨</button>
  </div>

  <!-- المرحلة الثانية -->
  <div id="step2" class="card hidden">
    <h1>بصراحة شديدة... ❤️</h1>
    <p>من فترة واكو كلام حاب أقوله إلك، وجودك واهتمامك يغير يومي للأفضل دائماً.</p>
    <button class="btn-yes" onclick="nextStep(3)">التالي ➡️</button>
  </div>

  <!-- المرحلة الثالثة (السؤال والزر الهارب) -->
  <div id="step3" class="card hidden">
    <h1>شنو رأيك ننطي فرصة؟ 🫣</h1>
    <p>تتوقعين نبلش فصل جديد لو نغلق الموضوع؟</p>
    <div class="btn-container">
      <button class="btn-yes" onclick="nextStep(4)">نعطي فرصة! ❤️</button>
      <button id="runawayBtn" class="btn-no" onmouseover="moveButton()" onclick="moveButton()">مستحيل 😜</button>
    </div>
  </div>

  <!-- المرحلة الأخيرة -->
  <div id="step4" class="card hidden">
    <h1>أفضل قرار! 🎉✨</h1>
    <p>أحلى خبر اليوم! راح أتواصل وياك مباشرةً الآن 😊</p>
  </div>

  <script>
    function nextStep(stepNumber) {
      document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
      document.getElementById('step' + stepNumber).classList.remove('hidden');
    }

    function moveButton() {
      const btn = document.getElementById('runawayBtn');
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 100);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 100);
      btn.style.position = 'fixed';
      btn.style.left = Math.max(20, x) + 'px';
      btn.style.top = Math.max(20, y) + 'px';
    }
  </script>
</body>
</html>
